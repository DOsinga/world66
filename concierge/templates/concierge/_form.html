<form method="post" action="{% url 'concierge:start' %}" class="concierge-form">
  {% csrf_token %}
  <input type="hidden" name="provider_path" value="{{ provider.path }}">

  <p class="concierge-form-intro">
    Tell the Concierge what you need. It will contact {{ provider.title }} on WhatsApp, negotiate on your behalf, and report back.
  </p>

  <div class="cform-grid">
    <div class="cform-field">
      <label class="cform-label" for="cf-name-{{ provider.slug }}">Your name</label>
      <input class="cform-input" type="text" id="cf-name-{{ provider.slug }}" name="user_name" required placeholder="Jane Smith">
    </div>

    <div class="cform-field">
      <label class="cform-label" for="cf-email-{{ provider.slug }}">Your email <span class="cform-hint">(we'll send the outcome here)</span></label>
      <input class="cform-input" type="email" id="cf-email-{{ provider.slug }}" name="user_email" required placeholder="you@example.com">
    </div>

    <div class="cform-field">
      <label class="cform-label" for="cf-dates-{{ provider.slug }}">Preferred dates</label>
      <input class="cform-input" type="text" id="cf-dates-{{ provider.slug }}" name="dates" placeholder="e.g. 12–15 June, flexible on time">
    </div>

    <div class="cform-field cform-field--narrow">
      <label class="cform-label" for="cf-group-{{ provider.slug }}">Group size</label>
      <input class="cform-input" type="number" id="cf-group-{{ provider.slug }}" name="group_size" min="1" value="2">
    </div>

    {% if provider.meta.price %}
    <div class="cform-field cform-field--narrow">
      <label class="cform-label" for="cf-target-{{ provider.slug }}">Target price <span class="cform-hint">(listed: {{ provider.meta.price }})</span></label>
      <input class="cform-input" type="text" id="cf-target-{{ provider.slug }}" name="target_price" placeholder="{{ provider.meta.price }}">
    </div>

    <div class="cform-field cform-field--narrow">
      <label class="cform-label" for="cf-max-{{ provider.slug }}">Maximum price <span class="cform-hint">(ceiling)</span></label>
      <input class="cform-input" type="text" id="cf-max-{{ provider.slug }}" name="max_price" placeholder="{{ provider.meta.price }}">
    </div>
    {% endif %}

    <div class="cform-field cform-field--full">
      <label class="cform-label" for="cf-notes-{{ provider.slug }}">Special requirements</label>
      <textarea class="cform-input cform-textarea" id="cf-notes-{{ provider.slug }}" name="notes" rows="3" placeholder="Dietary needs, accessibility, specific programme requests…"></textarea>
    </div>
  </div>

  <div class="cform-footer">
    <button type="submit" class="cform-submit">Send Concierge →</button>
    <p class="cform-footnote">The Concierge will message {{ provider.title }} on your behalf and update you here when it hears back.</p>
  </div>
</form>
