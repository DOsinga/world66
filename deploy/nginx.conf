server {
    listen 80;
    server_name world66.ai www.world66.ai staging.world66.ai;

    location /static/ {
        alias /home/world66/staticfiles/;
        expires 30d;
        add_header Cache-Control public;
        access_log off;
    }

    location /media/ {
        alias /home/world66/data/media/;
        expires 30d;
        add_header Cache-Control public;
        access_log off;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8066;
    }
}
