{% extends "guide/base.html" %}

{% block title %}Unlock — {{ passport.title }}{% endblock %}

{% block body_style %}
<style>
#content { display: none; }
.auth-wrap { max-width: 480px; margin: 80px auto; padding: 0 24px; }
.auth-card {
  background: white;
  border: 1px solid var(--line-2);
  border-radius: 16px;
  padding: 48px;
}
.auth-card h1 { font-family: var(--display-font); font-size: 2rem; font-weight: 300; margin-bottom: 8px; }
.auth-card .subtitle { color: var(--mute); margin-bottom: 32px; }
label { display: block; font-weight: 500; margin-bottom: 6px; font-size: .9rem; }
input[type=text] {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  font-size: 1rem;
  font-family: var(--body-font);
  background: var(--paper);
}
input:focus { outline: 2px solid var(--accent); border-color: transparent; }
.submit-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.submit-btn:hover { background: var(--accent-ink); }
.field { margin-bottom: 20px; }
.error-msg { color: #c0392b; font-size: .9rem; margin-bottom: 16px; padding: 10px 14px; background: #fdf0ef; border-radius: 6px; }
.lock-icon { font-size: 2.5rem; margin-bottom: 16px; display: block; }
</style>
{% endblock %}

{% block wide_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="lock-icon">🔒</span>
    <h1>{{ passport.title }}</h1>
    <p class="subtitle">Enter your passphrase to open this passport.</p>

    {% if error %}<p class="error-msg">{{ error }}</p>{% endif %}

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="phrase">Passphrase</label>
        <input type="text" id="phrase" name="phrase" autofocus autocomplete="off" placeholder="e.g. amber glacier market wolf">
      </div>
      <button type="submit" class="submit-btn">Unlock &rarr;</button>
    </form>
  </div>
</div>
{% endblock %}
