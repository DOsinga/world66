{% extends "guide/base.html" %}

{% block title %}Create a Travel Passport — World66{% endblock %}

{% block body_style %}
<style>
.auth-wrap {
  max-width: 480px;
  margin: 80px auto;
  padding: 0 24px;
}
.auth-card {
  background: white;
  border: 1px solid var(--line-2);
  border-radius: 16px;
  padding: 48px;
}
.auth-card h1 {
  font-family: var(--display-font);
  font-size: 2rem;
  font-weight: 300;
  margin-bottom: 8px;
}
.auth-card .subtitle { color: var(--mute); margin-bottom: 32px; }
label { display: block; font-weight: 500; margin-bottom: 6px; font-size: .9rem; }
input[type=text] {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  font-size: 1rem;
  font-family: var(--body-font);
  background: var(--paper);
}
input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }
.submit-btn {
  width: 100%;
  padding: 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
}
.submit-btn:hover { background: var(--accent-ink); }
.field { margin-bottom: 20px; }
.hint { font-size: .82rem; color: var(--mute); margin-top: 4px; }
</style>
{% endblock %}

{% block wide_content %}
<div class="auth-wrap">
  <div class="auth-card">
    <h1>New passport</h1>
    <p class="subtitle">Give it a name — you can always change it later.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label for="title">Passport name</label>
        <input type="text" id="title" name="title" placeholder="e.g. Southeast Asia 2026" autofocus>
        <p class="hint">Or leave blank for "My Travel Passport"</p>
      </div>
      <button type="submit" class="submit-btn">Create passport &rarr;</button>
    </form>
  </div>
</div>
{% endblock %}
